[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otripy"
version = "1.3.1"
description = "A tool to plan your next trip"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "folium>=0.19.5",
    "geopy>=2.4.1",
    "keyring>=25.6.0",
    "nc-py-api>=0.19.0",
    "packaging>=24.2",
    "pyside6>=6.8.2.1",
    "typing-extensions>=4.12.2",
]
authors = [{ name = "Gaël de Chalendar (aka Kleag)", email = "kleagg@gmail.com" }]
license = "AGPL-3.0-or-later"
license-files = ["AGPL.md"]
keywords = ["map", "tourism", "openstreetmap", "journey", "planning", "trip" ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
]

[tool.hatch.build.targets.sdist]
include = [    "src/otripy/**/*.py",
"src/otripy/resources/icons/**/*.svg",
    "src/otripy/resources/icons/LICENSE.md",
    "src/otripy/i18n/*.ts",
    "src/otripy/i18n/*.qm",
    "src/otripy/resources/icon-*.png"]

[tool.hatch.build.targets.wheel]
packages = ["src/otripy"]
include = [
    "src/otripy/**/*.py",
    "src/otripy/resources/icons/**/*.svg",
    "src/otripy/resources/icons/LICENSE.md",
    "src/otripy/i18n/*.ts",
    "src/otripy/i18n/*.qm",
    "src/otripy/resources/icon-*.png"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
include = [    "src/otripy/**/*.py",
"src/otripy/resources/icons/**/*.svg",
    "src/otripy/resources/icons/LICENSE.md",
    "src/otripy/i18n/*.ts",
    "src/otripy/i18n/*.qm",
    "src/otripy/resources/icon-*.png"]

[project.gui-scripts]
otripy = "otripy.main:main"

[project.optional-dependencies]
build = ["bumpver"]                   # For packaging and uploading
deploy = ["uv"]                               # Add tools needed for deployment

[project.urls]
Homepage = "https://github.com/kleag/otripy"
# Documentation = "https://readthedocs.org"
Repository = "https://github.com/kleag/otripy"
Issues = "https://github.com/kleag/otripy/issues"
# Changelog = "https://github.com/me/spam/blob/master/CHANGELOG.md"


[bumpver]
current_version = "1.3.1"
version_pattern = "MAJOR.MINOR.PATCH"
commit = true
tag = true
push = true  # Set to true if you want to push automatically
# Files the changelog's Unreleased entries under the new version, see the script
pre_commit_hook = "scripts/release_changelog.py"

[bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"src/otripy/__init__.py" = [
    '__version__ = "{version}"',
]


[tool.uv]
package = true

[tool.briefcase]
project_name = "Otripy"
bundle = "org.kleag.otripy"
version = "1.3.1"
author = "Gaël de Chalendar"
author_email = "kleagg@gmail.com"
url = "https://github.com/kleag/otripy"
license = "AGPL-3.0-or-later"
license-files = ["AGPL.md"]

[tool.briefcase.app.otripy]
formal_name = "Otripy"
description = "A tool to plan your next trip"
icon = "src/otripy/resources/icon"
sources = ["src/otripy"]
requires = [
    "folium",
    "geopy",
    "keyring",
    "nc-py-api",
    "packaging",
    "pyside6",
    "typing-extensions",
]

[dependency-groups]
appimage = [
    "pyinstaller>=6.11",
]
dev = [
    "hatch==1.14.0",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.9",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# Errors and likely bugs only; style rules can be added once the code base is cleaner.
select = ["E4", "E7", "E9", "F", "B"]

[tool.briefcase.app.otripy.macOS]
# PySide6 wheels (6.11) require macOS 13; Briefcase's default target is macOS 11.
min_os_version = "13.0"
