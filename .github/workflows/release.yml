name: Release

# bumpver tags releases as MAJOR.MINOR.PATCH (no "v" prefix).
# Run it by hand (workflow_dispatch) to build everything without publishing.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

jobs:
  dist:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check that the tag matches the project version
        if: github.ref_type == 'tag'
        run: |
          version=$(uv version --short)
          test "$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  bundles:
    name: Build ${{ matrix.platform }} bundle
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            options: ""
          - os: macos-latest
            platform: macOS
            # No Apple Developer ID: ad-hoc signed and not notarized, users
            # must allow the app once in System Settings > Privacy & Security.
            options: --adhoc-sign
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install briefcase
      # Briefcase installs [tool.briefcase.app.otripy] requires with pip, which
      # would take the latest versions: constrain them to uv.lock, the
      # versions the tests run with.
      - name: Export the locked versions as pip constraints
        run: uv export --frozen --no-dev --no-emit-project --no-hashes -o constraints.txt
      - name: Build the bundle
        shell: bash
        run: >-
          briefcase package ${{ matrix.platform }} --no-input ${{ matrix.options }}
          -C "requirement_installer_args=['--constraint', './constraints.txt']"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            dist/*.msi
            dist/*.dmg

  appimage:
    name: Build Linux AppImage
    # Ubuntu 22.04 (glibc 2.35) is the oldest base current PySide6 wheels
    # support (glibc 2.34): the AppImage runs there and on newer distributions.
    # When GitHub retires this runner image, run the same script in an
    # ubuntu:22.04 container on ubuntu-latest (see build-appimage.sh).
    runs-on: ubuntu-22.04
    # Least proven of the bundles: never block PyPI or the other installers.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-linux
          path: dist/*.AppImage

  publish-pypi:
    name: Publish to PyPI
    if: github.ref_type == 'tag'
    needs: [dist, bundles]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    # Runs even if the AppImage failed, as long as the other builds succeeded.
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.dist.result == 'success' && needs.bundles.result == 'success' }}
    needs: [dist, bundles, appimage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
